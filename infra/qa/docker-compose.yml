services:

  # =========================
  # NGINX API GATEWAY
  # =========================
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: vetreserve-qa-nginx-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-management-service
      - auth-identity-service
    networks:
      - vetreserve-qa

  # =========================
  # ZOOKEEPER
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vetreserve-qa-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - vetreserve-qa

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vetreserve-qa-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - vetreserve-qa

  # =========================
  # RABBITMQ
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vetreserve-qa-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - vetreserve-qa

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:16
    container_name: vetreserve-qa-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vetreserve-qa

  # =========================
  # MONGODB
  # =========================
  mongodb:
    image: mongo:6
    container_name: vetreserve-qa-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_clinical_data:/data/db
    networks:
      - vetreserve-qa

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7
    container_name: vetreserve-qa-redis
    restart: always
    volumes:
      - redis_notifications_data:/data
    networks:
      - vetreserve-qa

  # =========================
  # MQTT
  # =========================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vetreserve-qa-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - vetreserve-qa

  # =========================
  # N8N
  # =========================
  n8n:
    image: n8nio/n8n:latest
    container_name: vetreserve-qa-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - vetreserve-qa

  # =========================
  # USER MANAGEMENT
  # =========================
  user-management-service:
    container_name: vetreserve-qa-user-management
    restart: always
    build:
      context: ../../backend/domain/identity-access/user-management-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/identity_access_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetreserve-qa

  # =========================
  # AUTH & IDENTITY
  # =========================
  auth-identity-service:
    container_name: vetreserve-qa-auth-identity
    restart: always
    build:
      context: ../../backend/domain/identity-access/auth-identity-service
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: vetreserve-qa-secret
      USER_MANAGEMENT_BASE_URL: http://user-management-service:8000
    depends_on:
      - user-management-service
    networks:
      - vetreserve-qa

  # =========================
  # OWNER MANAGEMENT
  # =========================
  owner-management-service:
    container_name: vetreserve-qa-owner-management
    restart: always
    build:
      context: ../../backend/domain/client-pet-management/owner-management-service
    ports:
      - "8005:8003"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: client_pet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetreserve-qa

  # =========================
  # PET MANAGEMENT
  # =========================
  pet-management-service:
    container_name: vetreserve-qa-pet-management
    restart: always
    build:
      context: ../../backend/domain/client-pet-management/pet-management-service
    ports:
      - "8006:8006"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: client_pet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PET_CREATED_TOPIC: pet.created
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vetreserve-qa

  # =========================
  # CLINICAL RECORDS
  # =========================
  clinical-records-service:
    container_name: vetreserve-qa-clinical-records
    restart: always
    build:
      context: ../../backend/domain/clinical-information/clinical-records-service
    ports:
      - "8008:8000"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: clinical_db
      CLINICAL_RECORDS_COLLECTION: clinical_records
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APPOINTMENT_COMPLETED_TOPIC: appointment.completed
      KAFKA_CONSUMER_GROUP: clinical-records-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_EXCHANGE: clinical.events
      RABBITMQ_ROUTING_KEY: clinical.record.created
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/clinical-record-created
    depends_on:
      - mongodb
      - kafka
      - rabbitmq
      - n8n
    networks:
      - vetreserve-qa

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    container_name: vetreserve-qa-notification
    restart: always
    build:
      context: ../../backend/domain/communication-insights/notification-service
    ports:
      - "8007:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_EXCHANGE: clinical.events
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: 1883
      MQTT_NOTIFICATION_TOPIC: vetreserve/notifications
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      - rabbitmq
      - mqtt
      - redis
    networks:
      - vetreserve-qa

  # =========================
  # INTEGRATION & AUTOMATION
  # =========================
  integration-automation-service:
    container_name: vetreserve-qa-integration-automation
    restart: always
    build:
      context: ../../backend/domain/integration-automation/integration-automation-service
    ports:
      - "8009:8000"
    environment:
      SERVICE_NAME: Integration & Automation Service
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_PATH: /webhook/vetreserve-appointment-completed
      N8N_TIMEOUT_SECONDS: 8
    depends_on:
      - n8n
    networks:
      - vetreserve-qa

  # =========================
  # VET SCHEDULE
  # =========================
  vet-schedule-service:
    container_name: vetreserve-qa-vet-schedule
    restart: always
    build:
      context: ../../backend/domain/scheduling-appointments/vet-schedule-service
    ports:
      - "8003:8000"
    environment:
      ENV: qa
      DB_ENGINE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: scheduling_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetreserve-qa

  # =========================
  # APPOINTMENT MANAGEMENT
  # =========================
  appointment-management-service:
    container_name: vetreserve-qa-appointment-management
    restart: always
    build:
      context: ../../backend/domain/scheduling-appointments/appointment-management-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/appointments_db
      JWT_SECRET: vetreserve-qa-secret
      VET_SCHEDULE_BASE_URL: http://vet-schedule-service:8000
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vetreserve-qa

  # =========================
  # REPORTING & ANALYTICS
  # =========================
  reporting-analytics-service:
    container_name: vetreserve-qa-reporting-analytics
    restart: always
    build:
      context: ../../backend/domain/communication-insights/reporting-analytics-service
    ports:
      - "8010:8010"
    environment:
      SERVICE_NAME: reporting-analytics-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_EXCHANGE: clinical.events
      RABBITMQ_QUEUE: analytics.clinical.records
      RABBITMQ_ROUTING_KEY: clinical.record.created
    depends_on:
      - rabbitmq
    networks:
      - vetreserve-qa

  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: vetreserve-qa-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vetreserve-qa

  # =========================
  # GRAFANA
  # =========================
  grafana:
    image: grafana/grafana:latest
    container_name: vetreserve-qa-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - vetreserve-qa

volumes:
  postgres_data:
  mongo_clinical_data:
  redis_notifications_data:
  prometheus_data:
  grafana_data:

networks:
  vetreserve-qa:
    driver: bridge
