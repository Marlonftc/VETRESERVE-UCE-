# =====================================================
# NGINX API Gateway - VETRESERVE-UCE (QA)
# =====================================================

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  sendfile on;
  keepalive_timeout 65;

  # =====================================================
  # UPSTREAMS (Docker internal DNS)
  # =====================================================

  upstream user_management_service {
    server user-management-service:8000;
  }

  upstream auth_identity_service {
    server auth-identity-service:8000;
  }

  upstream owner_management_service {
    server owner-management-service:8003;
  }

  upstream pet_management_service {
    server pet-management-service:8006;
  }

  upstream vet_schedule_service {
    server vet-schedule-service:8000;
  }

  upstream appointment_management_service {
    server appointment-management-service:8000;
  }

  upstream clinical_records_service {
    server clinical-records-service:8000;
  }

  upstream notification_service {
    server notification-service:8000;
  }

  upstream integration_automation_service {
    server integration-automation-service:8000;
  }

  upstream reporting_analytics_service {
    server reporting-analytics-service:8000;
  }

  # =====================================================
  # SERVER
  # =====================================================
  server {
    listen 80;
    client_max_body_size 10m;

    # -------------------------------------------------
    # Gateway Health
    # -------------------------------------------------
    location = /health {
      return 200 '{"status":"ok","gateway":"nginx","env":"qa"}';
    }

    # =================================================
    # IDENTITY & ACCESS DOMAIN
    # =================================================

    location /api/users/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      proxy_pass http://user_management_service/users/;
    }

    location /api/auth/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      proxy_pass http://auth_identity_service/auth/;
    }

    # =================================================
    # CLIENT & PET MANAGEMENT DOMAIN
    # =================================================

    location ~ ^/api/owners(/.*)?$ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      rewrite ^/api/owners/?$ /owners/ break;
      rewrite ^/api/owners/(.+)$ /owners/$1 break;

      proxy_pass http://owner_management_service;
    }

    location ~ ^/api/pets(/.*)?$ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      rewrite ^/api/pets/?$ /pets/ break;
      rewrite ^/api/pets/(.+)$ /pets/$1 break;

      proxy_pass http://pet_management_service;
    }

    # =================================================
    # ✅ SCHEDULING & APPOINTMENTS DOMAIN (CORREGIDO)
    # =================================================

    location /api/schedules/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      # 🔥 CLAVE: proxy_pass con la ruta real del microservicio
      proxy_pass http://vet_schedule_service/schedules;
    }

    location /api/appointments/ {
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_redirect off;

      proxy_pass http://appointment_management_service/appointments;
    }


    # =================================================
    # CLINICAL INFORMATION DOMAIN
    # =================================================

    location /api/clinical-records {
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_redirect off;

      proxy_pass http://clinical_records_service/clinical-records;
     }


    # =================================================
    # COMMUNICATION & INSIGHTS DOMAIN
    # =================================================

    location /api/notifications/health {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_pass http://notification_service/health;
    }

    location /api/analytics/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      rewrite ^/api/analytics/?$ / break;
      rewrite ^/api/analytics/(.+)$ /$1 break;

      proxy_pass http://reporting_analytics_service;
    }

    # =================================================
    # INTEGRATION & AUTOMATION DOMAIN
    # =================================================

    location /api/webhooks/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;

      proxy_pass http://integration_automation_service/webhooks/;
    }

    # -------------------------------------------------
    # Fallback
    # -------------------------------------------------
    location / {
      return 404 '{"error":"route_not_found","gateway":"nginx"}';
    }
  }
}
