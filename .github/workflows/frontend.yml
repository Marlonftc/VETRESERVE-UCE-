name: frontend (QA)

on:
  push:
    branches: [ "qa" ]
    paths:
      - "frontend/web-app/**"
      - ".github/workflows/frontend.yml"

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  VITE_API_BASE: http://ec2-34-237-174-159.compute-1.amazonaws.com
  FRONTEND_PORT: 3000

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend (QA)
        uses: docker/build-push-action@v6
        with:
          context: frontend/web-app
          file: frontend/web-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-frontend:qa
            ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (QA)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-frontend:qa
            docker rm -f vetreserve-frontend-qa || true
            docker run -d --name vetreserve-frontend-qa -p ${{ env.FRONTEND_PORT }}:80 ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-frontend:qa
