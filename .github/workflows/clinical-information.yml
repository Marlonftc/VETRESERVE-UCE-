name: clinical-information (QA)

on:
  push:
    branches:
      - qa
    paths:
      - "backend/domain/clinical-information/**"
      - ".github/workflows/clinical-information.yml"

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image (QA)
        uses: docker/build-push-action@v6
        with:
          context: backend/domain/clinical-information/clinical-records-service
          file: backend/domain/clinical-information/clinical-records-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-clinical-records-service:qa
            ${{ secrets.DOCKERHUB_USERNAME }}/vetreserve-clinical-records-service:${{ github.sha }}
